# Mod world.foliage ("Grass and flowers"): plantas sobre el terreno.
# Una sección [nombre] por tipo de planta. Claves:
#   images   = png de esta carpeta, separados por comas (se elige uno al azar por planta)
#   texture  = aspecto de la textura del terreno donde crece, por su color medio:
#              green (hierba), dry (tierra marrón, hierba seca), sand, rock, snow
#   terrain  = y/o tipo de material del LND (el "type" de cada textura; a menudo no coincide con el aspecto,
#              p. ej. hay texturas verdes marcadas Earth): Grass, WetGrass, DryGrass, Rushes, Ferns, Corn,
#              Scrub, Heather, ForestUndergrowth, Earth, WetEarth, HardEarth, RiverMud, Sand, WetSand...
#              (crece si la textura cumple texture o terrain)
#   per_cell = plantas por celda de 10 x 10 unidades con densidad "medium"
#   size     = ancho mínimo-máximo en unidades del mundo (el alto sale de la proporción de la imagen;
#              una casa mide unas 15 unidades)
#   altitude = altura mínima-máxima sobre el mar
#   slope    = pendiente mínima-máxima en grados
#   patches  = 0 reparte por igual, 1 solo en manchas
#   sway     = cuánto lo mueve el viento (0 = nada)
#   lean     = inclinación máxima al azar de cada planta (para que se vean también desde arriba)
#   tint     = grey: los píxeles grises toman el color del suelo que hay debajo (hojas monocromas; los
#              pétalos de color no cambian); all: toda la imagen pasa a gris y se tinta; none: colores de la imagen
# Las imágenes gen_* las genera C:\Users\diewgarc\dev\gen_grass_sprites.py (hojas grises y flores de color);
# las mono_* son las originales con lo verde pasado a gris (C:\Users\diewgarc\dev\mono_sprites.py).

[grass]
images   = gen_grass_1.png, gen_grass_2.png, gen_grass_3.png, gen_grass_4.png, mono_grass_1.png, mono_grass_2.png, mono_grass_3.png
texture  = green
terrain  = Grass, WetGrass, Ferns
per_cell = 90
size     = 0.9-1.6
altitude = 1-250
slope    = 0-50
patches  = 0.1
sway     = 0.8
lean     = 0.6
tint     = grey

[long_grass]
images   = gen_long_grass_1.png, gen_long_grass_2.png, mono_tall_grass_1.png, mono_tall_grass_2.png, mono_tall_grass_3.png
texture  = green, dry
terrain  = DryGrass, Scrub
per_cell = 18
size     = 1.0-1.7
altitude = 1-250
slope    = 0-40
patches  = 0.5
sway     = 1.0
lean     = 0.5
tint     = grey

[flowers]
images   = gen_flowers_white.png, gen_flowers_yellow.png, gen_flowers_blue.png
texture  = green
per_cell = 3
size     = 0.7-1.0
altitude = 2-150
slope    = 0-25
patches  = 0.6
sway     = 1.0
lean     = 0.2
tint     = grey

[wildflowers]
images   = mono_flowers_1.png, mono_flowers_2.png, mono_flowers_3.png
texture  = green
per_cell = 0.8
size     = 0.9-1.3
altitude = 2-150
slope    = 0-25
patches  = 0.7
sway     = 1.0
lean     = 0.2
tint     = grey

[rushes]
images   = mono_rushes_1.png, mono_rushes_2.png
texture  = green, dry
terrain  = Rushes, WetGrass, WetEarth, RiverMud
per_cell = 3
size     = 1.8-2.6
altitude = 0-6
slope    = 0-25
patches  = 0.4
sway     = 0.8
lean     = 0.2
tint     = grey

[dead_bush]
images   = dead_bush_1.png, dead_bush_2.png
texture  = dry, sand
per_cell = 0.2
size     = 1.5-2.5
altitude = 1-300
slope    = 0-30
patches  = 0.3
sway     = 0.1
lean     = 0.2
tint     = none
